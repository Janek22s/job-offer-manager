{% extends 'base.html' %}

{% block content %}

<h2 class="text-center"> Create offer for {{ employer.company.name }} </h2>

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label"> Title </label>
            <input type="text" name="title" class="form-control" placeholder="Enter title">
    </div>

    <div class="mb-3">
        <label class="form-label"> Description </label>
            <textarea id="description" name="description" class="form-control" rows="6" placeholder="Enter description"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label"> Requirements </label>
            <textarea id="requirements" name="requirements" class="form-control" rows="6" placeholder="Enter requirements"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label"> Responsibilities </label>
            <textarea id="responsibilities" name="responsibilities" class="form-control" rows="6" placeholder="Enter responsibilities"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label"> Location </label>
            <input type="text" name="location" class="form-control" placeholder="Enter location">
    </div>

    <div class="mb-3">
        <label for="employment_type" class="form-label">Employment type</label>
        <select id="employment_type" name="employment_type" class="form-select" required>
            <option value="" selected disabled>Choose employment type</option>
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Contract">Contract</option>
            <option value="Temporary">Temporary</option>
            <option value="Internship">Internship</option>
            <option value="Seasonal">Seasonal</option>
            <option value="Volunteer">Volunteer</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="work_mode" class="form-label">Work mode</label>
        <select id="work_mode" name="work_mode" class="form-select" required>
            <option value="" selected disabled>Choose work mode</option>
            <option value="Remote">Remote</option>
            <option value="Hybrid">Hybrid</option>
            <option value="Onsite">On-site</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="contract_type" class="form-label">Contract type</label>
        <select id="contract_type" name="contract_type" class="form-select" required>
            <option value="" selected disabled>Choose contract type</option>
            <option value="B2b">B2b</option>
            <option value="Employment contract">Employment contract</option>
            <option value="Contract of mandate">Contract of mandate</option>
            <option value="Contract for specific work">Contract for specific work</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <select id="status" name="status" class="form-select" required>
            <option value="" selected disabled>Choose status</option>
            <option value="Draft">Draft</option>
            <option value="Active">Active</option>
            <option value="Closed">Closed</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="role_choice" class="form-label">Experience level</label>
        <select id="role_choice" name="experience_level" class="form-select" required>
            <option value="" selected disabled>Choose experience level</option>
            <option value="Intern">Intern</option>
            <option value="Entry level">Entry level</option>
            <option value="Junior">Junior</option>
            <option value="Mid level">Mid level</option>
            <option value="Senior">Senior</option>
            <option value="Lead">Lead</option>
            <option value="Expert">Expert</option>
        </select>
    </div>



    <div class="mb-3">
        <label class="form-label"> Minimum salary </label>
            <input type="text" name="salary_min" class="form-control" placeholder="Enter minimum salary">
    </div>

    <div class="mb-3">
        <label class="form-label"> Maxium salary </label>
            <input type="text" name="salary_max" class="form-control" placeholder="Enter maximum salary">
    </div>
    
    <div class="mb-3">
        <label for="date" class="form-label"> Expiration date </label>
        <input type="date" id="expiration_date" name="expiration_date" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary"> Create offer </button>
</form>

{% endblock %}
